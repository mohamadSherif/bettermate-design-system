<div class="bm-stage">
  <div class="bm-stack" style="width:366px">
    <button class="bm-cta"><span class="bm-cta__text"><span class="bm-cta__label">Start shot</span><span class="bm-cta__sub">Stops at 36 g</span></span><span class="bm-cta__disc" data-icon="play"></span></button>
    <button class="bm-cta"><span class="bm-cta__text"><span class="bm-cta__label">Wake up</span><span class="bm-cta__sub">Ready in about 4 min</span></span><span class="bm-cta__disc" data-icon="power"></span></button>
    <button class="bm-cta" aria-busy="true"><span class="bm-cta__text"><span class="bm-cta__label">Starting</span><span class="bm-cta__sub">Waiting for the machine</span></span><span class="bm-cta__disc" data-loader data-size="24"></span></button>
  </div>
  <div class="bm-stack" style="width:366px">
    <button class="bm-cta bm-cta--stop"><span class="bm-cta__text"><span class="bm-cta__label">Stop shot</span><span class="bm-cta__sub">21.7 of 36 g</span><span class="bm-segbar bm-segbar--fill" data-segbar="14/24"></span></span><span class="bm-cta__disc" data-icon="stop"></span></button>
    <button class="bm-cta bm-cta--stop"><span class="bm-cta__text"><span class="bm-cta__label">Stop grinding</span><span class="bm-cta__sub">11.4 of 18 g</span><span class="bm-segbar bm-segbar--fill" data-segbar="15/24"></span></span><span class="bm-cta__disc" data-icon="stop"></span></button>
    <button class="bm-cta" disabled><span class="bm-cta__text"><span class="bm-cta__label">Start shot</span><span class="bm-cta__sub">Fix the fault to brew</span></span><span class="bm-cta__disc" data-icon="play"></span></button>
  </div>
  <div class="bm-stack" style="width:296px">
    <span class="bm-eyebrow">At 320 px</span>
    <button class="bm-cta"><span class="bm-cta__text"><span class="bm-cta__label">Start grinding</span><span class="bm-cta__sub">Stops at 18.0 g, about 12 s</span></span><span class="bm-cta__disc" data-icon="play"></span></button>
  </div>
</div>
