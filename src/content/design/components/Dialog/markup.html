<div class="bm-stage">
  <div class="bm-stack" style="width:560px">
    <span class="bm-eyebrow">Centred, from 600 px</span>
    <div class="bm-float" style="height:300px">
      <div style="padding:var(--space-3)"><section class="bm-tile"><h2 class="bm-sub">Profiles</h2><p class="bm-help">The page behind is inert.</p></section></div>
      <div class="bm-scrim"></div>
      <div class="bm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="d1t" aria-describedby="d1b">
        <h2 class="bm-dialog__title" id="d1t">Delete Adaptive v2?</h2>
        <p class="bm-dialog__body" id="d1b">Its 14 shots stay in History. The profile cannot be brought back.</p>
        <div class="bm-dialog__actions"><button class="bm-btn">Keep</button><button class="bm-btn bm-btn--danger">Delete profile</button></div>
      </div>
    </div>
  </div>
  <div class="bm-stack" style="width:320px">
    <span class="bm-eyebrow">A sheet, on a phone</span>
    <div class="bm-float" style="height:300px">
      <div style="padding:var(--space-3)"><section class="bm-tile"><h2 class="bm-sub">First</h2><p class="bm-help">93° · 36 g · 30 s, changed.</p></section></div>
      <div class="bm-scrim"></div>
      <div class="bm-dialog bm-dialog--sheet" role="dialog" aria-modal="true" aria-labelledby="d2t">
        <h2 class="bm-dialog__title" id="d2t">Save changes</h2>
        <div class="bm-dialog__actions bm-dialog__actions--stack"><button class="bm-btn bm-btn--primary">Save</button><button class="bm-btn">Save as new</button><button class="bm-btn bm-btn--ghost">Use once</button></div>
      </div>
    </div>
  </div>
</div>
