<div class="bm-stage">
  <section class="bm-tile" style="width:366px">
    <div class="bm-grid2">
      <label class="bm-field"><span class="bm-field__label">Dose</span><span class="bm-inputwrap"><input class="bm-input bm-input--num" inputmode="decimal" value="18.0" aria-describedby="u1"><span class="bm-input__unit" id="u1" aria-label="grams">g</span></span></label>
      <label class="bm-field"><span class="bm-field__label">Yield</span><span class="bm-inputwrap"><input class="bm-input bm-input--num" inputmode="decimal" value="36.0" aria-describedby="u2"><span class="bm-input__unit" id="u2" aria-label="grams">g</span></span></label>
    </div>
    <label class="bm-field"><span class="bm-field__label">Target temperature</span><span class="bm-inputwrap"><input class="bm-input bm-input--num" inputmode="numeric" value="93" aria-describedby="u3 h3"><span class="bm-input__unit" id="u3" aria-label="degrees Celsius">°C</span></span><p class="bm-help" id="h3">80 to 100 °C.</p></label>
  </section>
  <section class="bm-tile" style="width:366px">
    <label class="bm-field"><span class="bm-field__label">Pressure</span><span class="bm-inputwrap"><input class="bm-input bm-input--num" inputmode="decimal" value="14.0" aria-invalid="true" aria-describedby="u4 e4"><span class="bm-input__unit" id="u4" aria-label="bar">bar</span></span><span class="bm-field__msg bm-field__msg--error" id="e4"><span data-icon="circle-alert" data-size="14"></span>Enter 0.0 to 12.0 bar.</span></label>
    <div class="bm-grid2">
      <label class="bm-field"><span class="bm-field__label">Flow limit</span><span class="bm-inputwrap"><input class="bm-input bm-input--num" inputmode="decimal" value="2.5" aria-describedby="u5"><span class="bm-input__unit" id="u5" aria-label="millilitres a second">ml/s</span></span></label>
      <label class="bm-field"><span class="bm-field__label">Standby after</span><span class="bm-inputwrap"><input class="bm-input bm-input--num" inputmode="numeric" value="30" aria-describedby="u6"><span class="bm-input__unit" id="u6" aria-label="minutes">min</span></span></label>
    </div>
  </section>
</div>
