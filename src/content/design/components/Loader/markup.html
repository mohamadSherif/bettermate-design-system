<div class="bm-stage" style="align-items:center">
  <div class="bm-rowx" style="gap:var(--space-5)"><span data-loader data-size="14"></span><span data-loader data-size="20"></span><span data-loader data-size="24"></span><span data-loader data-size="40"></span></div>
  <div class="bm-stack" style="width:300px">
    <button class="bm-btn bm-btn--primary bm-btn--block" aria-busy="true"><span data-loader data-size="18"></span>Saving</button>
