<div class="bm-stage" style="gap:var(--space-12);padding-top:var(--space-12)">
  <div style="position:relative"><button class="bm-btn bm-btn--icon" aria-label="Tare the scale"><span data-icon="scale"></span></button><span class="bm-tooltip" aria-hidden="true" style="position:absolute;left:50%;bottom:calc(100% + var(--space-2));transform:translateX(-50%);white-space:nowrap">Tare the scale</span></div>
  <div style="position:relative"><button class="bm-btn bm-btn--icon bm-btn--quiet is-focus" aria-label="More"><span data-icon="more-horizontal"></span></button><span class="bm-tooltip" aria-hidden="true" style="position:absolute;left:50%;bottom:calc(100% + var(--space-2));transform:translateX(-50%);white-space:nowrap">More</span></div>
  <div style="position:relative"><button class="bm-btn bm-btn--icon bm-btn--ink" aria-label="New profile"><span data-icon="plus"></span></button><span class="bm-tooltip" aria-hidden="true" style="position:absolute;left:50%;top:calc(100% + var(--space-2));transform:translateX(-50%);white-space:nowrap">New profile</span></div>
</div>
