<div class="bm-stage">
  <section class="bm-tile" style="width:366px">
    <label class="bm-field"><span class="bm-field__label">Network</span><span class="bm-inputwrap"><select class="bm-select"><option>Home 5G</option><option>Home 2.4</option><option>Workshop</option><option>Other network</option></select><span class="bm-input__icon" data-icon="chevron-down" data-size="20"></span></span><p class="bm-help">Strongest first. The machine needs 2.4 GHz or 5 GHz.</p></label>
    <label class="bm-field"><span class="bm-field__label">Timezone</span><span class="bm-inputwrap"><select class="bm-select"><option>New York (UTC−5)</option><option>Chicago (UTC−6)</option><option>Denver (UTC−7)</option><option>Los Angeles (UTC−8)</option></select><span class="bm-input__icon" data-icon="chevron-down" data-size="20"></span></span></label>
  </section>
  <section class="bm-tile" style="width:366px">
    <label class="bm-field"><span class="bm-field__label">Scale</span><span class="bm-inputwrap"><select class="bm-select" aria-invalid="true" aria-describedby="se"><option>Choose a scale</option><option>Bookoo Mini</option><option>Acaia Lunar</option></select><span class="bm-input__icon" data-icon="chevron-down" data-size="20"></span></span><span class="bm-field__msg bm-field__msg--error" id="se"><span data-icon="circle-alert" data-size="14"></span>Choose a scale, or turn off Stop by weight.</span></label>
    <label class="bm-field"><span class="bm-field__label">Network</span><span class="bm-inputwrap"><select class="bm-select" disabled aria-describedby="sc"><option>Scanning</option></select><span class="bm-input__icon" data-icon="chevron-down" data-size="20"></span></span><span class="bm-field__msg" id="sc"><span data-loader data-size="14"></span>Looking for networks nearby.</span></label>
  </section>
</div>
