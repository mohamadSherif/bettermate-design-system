<div class="bm-stage">
  <div class="bm-stack" style="width:320px">
    <span class="bm-eyebrow">Plain</span>
    <div class="bm-toast" role="status">Profile saved</div>
    <span class="bm-eyebrow">With one action</span>
    <div class="bm-toast bm-toast--action" role="status"><span style="flex:1">Adaptive v2 deleted</span><button class="bm-btn bm-btn--quiet">Undo</button></div>
    <span class="bm-eyebrow">A failure, also shown in place</span>
    <div class="bm-toast" role="alert">Could not save. Check the connection.</div>
  </div>
  <div class="bm-stack" style="width:320px">
    <span class="bm-eyebrow">Where it sits on a phone</span>
    <div class="bm-float" style="height:236px">
      <div style="padding:var(--space-3)"><section class="bm-tile"><div class="bm-tile__head"><h2 class="bm-sub">Profiles</h2></div><p class="bm-help">The page stays as it was.</p></section></div>
      <div class="bm-toasts" style="bottom:calc(var(--space-16) + var(--space-5))"><div class="bm-toast" role="status">Stop the shot to change mode</div></div>
      <nav class="bm-modebar" aria-label="Machine mode" data-no-audit style="position:absolute;left:var(--space-3);right:var(--space-3);bottom:var(--space-3)"><button class="bm-modebar__item" aria-pressed="false" aria-disabled="true"><span data-icon="power" data-size="22"></span>Standby</button><button class="bm-modebar__item" aria-pressed="true"><span data-icon="coffee" data-size="22"></span>Brew</button><button class="bm-modebar__item" aria-pressed="false"><span data-icon="wind" data-size="22"></span>Steam</button><button class="bm-modebar__item" aria-pressed="false" aria-disabled="true"><span data-icon="droplet" data-size="22"></span>Water</button></nav>
    </div>
  </div>
</div>
