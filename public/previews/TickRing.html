<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tick ring</title>
<link rel="stylesheet" href="/design/tokens.css">
<link rel="stylesheet" href="/design/bundle.css">
<style>html,body{background:var(--surface-0)}body{overflow-x:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme]) .bm-wm--light{display:none}:root:not([data-theme]) .bm-wm--dark{display:block}}</style>
<script>
/* Follow the theme of the page this preview sits in. */
(function () {
  var html = document.documentElement;
  function sync() {
    try {
      var t = parent.document.documentElement.getAttribute('data-theme');
      if (t) html.setAttribute('data-theme', t); else html.removeAttribute('data-theme');
    } catch (e) {}
  }
  sync();
  try { new MutationObserver(sync).observe(parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
})();
</script>
<script src="/design/bundle.js"></script>
</head>
<body>
<div class="bm-stage">
  <figure class="bm-fig"><div id="split"></div><figcaption>Split: boiler left, pump right</figcaption></figure>
  <figure class="bm-fig"><div id="single"></div><figcaption>Single: one quantity, 300 degrees</figcaption></figure>
  <figure class="bm-fig"><div id="progress"></div><figcaption>Progress: grind, in ink</figcaption></figure>
  <figure class="bm-fig"><div id="standby"></div><figcaption>Standby: residual heat, greyed</figcaption></figure>
</div>
<script>
var B = BetterMate, t = B.draw.tx;
function put(id, ring, a, b, c) { document.getElementById(id).innerHTML = B.wrap(B.ringParts(ring) + t(240, 222, 'bmf-value bmf-ink', a) + t(240, 262, 'bmf-label bmf-muted', b) + t(240, 292, 'bmf-label bmf-muted', c)); }
put('split', { left: [0.58, 0.58, 'heat'], right: [0.56, 0.5625, 'primary'] }, '36 + 36', 'TICKS, 4° APART', 'NOTCH = TARGET');
put('single', { full: [0.8, 0.906, 'heat'] }, '76', 'TICKS OVER 300°', '0 TO 160 °C');
put('progress', { full: [0.63, -1, 'ink'] }, '63%', 'ONE TICK = 1.3%', 'NO NOTCH');
put('standby', { full: [0.13, -1, 'faint'] }, '21°', 'INK-FAINT', 'NO NOTCH');
</script>
</body>
</html>
