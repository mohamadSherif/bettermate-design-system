<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stepper</title>
<link rel="stylesheet" href="/design/tokens.css">
<link rel="stylesheet" href="/design/bundle.css">
<style>html,body{background:var(--surface-0)}body{overflow-x:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme]) .bm-wm--light{display:none}:root:not([data-theme]) .bm-wm--dark{display:block}}</style>
<script>
/* Follow the theme of the page this preview sits in. */
(function () {
  var html = document.documentElement;
  function sync() {
    try {
      var t = parent.document.documentElement.getAttribute('data-theme');
      if (t) html.setAttribute('data-theme', t); else html.removeAttribute('data-theme');
    } catch (e) {}
  }
  sync();
  try { new MutationObserver(sync).observe(parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
})();
</script>
<script src="/design/bundle.js"></script>
</head>
<body>
<div class="bm-stage"><div class="bm-rowx" style="gap:var(--space-8)">
  <span class="bm-stepper" role="group" aria-label="Target temperature"><button class="bm-stepper__btn" aria-label="Lower target temperature" data-icon="minus"></button><output class="bm-stepper__value" id="v" aria-live="polite">93°</output><button class="bm-stepper__btn" aria-label="Raise target temperature" data-icon="plus"></button></span>
  <div class="bm-cell" style="flex-direction:row;align-items:center;gap:var(--space-5)"><span class="bm-field__label">Grind target</span><span class="bm-stepper bm-stepper--on-cell" role="group" aria-label="Grind target"><button class="bm-stepper__btn" aria-label="Less" data-icon="minus"></button><output class="bm-stepper__value">18.0 g</output><button class="bm-stepper__btn" aria-label="More" data-icon="plus"></button></span></div>
  <span class="bm-stepper" role="group" aria-label="Steam temperature"><button class="bm-stepper__btn" aria-label="Lower steam temperature" data-icon="minus"></button><output class="bm-stepper__value">160°</output><button class="bm-stepper__btn" aria-label="Raise steam temperature" data-icon="plus" disabled></button></span>
</div></div>
<script>
BetterMate.hydrate();
var v = 93, out = document.getElementById('v'), btns = out.parentNode.querySelectorAll('button');
function show() { out.textContent = v + '°'; btns[0].disabled = v <= 80; btns[1].disabled = v >= 100; }
btns[0].onclick = function () { v = Math.max(80, v - 1); show(); };
btns[1].onclick = function () { v = Math.min(100, v + 1); show(); };
</script>
</body>
</html>
