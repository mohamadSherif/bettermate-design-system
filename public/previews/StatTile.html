<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stat tile</title>
<link rel="stylesheet" href="/design/tokens.css">
<link rel="stylesheet" href="/design/bundle.css">
<style>html,body{background:var(--surface-0)}body{overflow-x:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme]) .bm-wm--light{display:none}:root:not([data-theme]) .bm-wm--dark{display:block}}</style>
<script>
/* Follow the theme of the page this preview sits in. */
(function () {
  var html = document.documentElement;
  function sync() {
    try {
      var t = parent.document.documentElement.getAttribute('data-theme');
      if (t) html.setAttribute('data-theme', t); else html.removeAttribute('data-theme');
    } catch (e) {}
  }
  sync();
  try { new MutationObserver(sync).observe(parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
})();
</script>
<script src="/design/bundle.js"></script>
</head>
<body>
<div class="bm-stage">
  <section class="bm-tile" style="width:200px"><div class="bm-stat"><span class="bm-eyebrow">Water tank</span><div class="bm-stat__row"><span class="bm-stat__value">94</span><span class="bm-stat__unit">%</span></div><div class="bm-segbar bm-segbar--fill" data-segbar="19/20"></div></div></section>
  <section class="bm-tile" style="width:200px"><div class="bm-stat"><span class="bm-eyebrow">Pressure</span><div class="bm-stat__row"><span class="bm-stat__value">9.0</span><span class="bm-stat__unit">bar</span><span class="bm-stat__target">/ 9.0</span></div><div class="bm-segbar bm-segbar--fill bm-segbar--primary" data-segbar="11/20/11"></div></div></section>
  <section class="bm-tile bm-tile--heat" style="width:200px"><div class="bm-tile__head"><span class="bm-eyebrow">Boiler</span><span class="bm-chip bm-chip--heat">Heating</span></div><div class="bm-stat"><div class="bm-stat__row"><span class="bm-stat__value">78</span><span class="bm-stat__unit">°C</span><span class="bm-stat__target">/ 93</span></div><div class="bm-segbar bm-segbar--fill bm-segbar--heat" data-segbar="10/20/12"></div></div></section>
  <section class="bm-tile" style="width:200px"><div class="bm-stat"><span class="bm-eyebrow">Flow</span><div class="bm-stat__row"><span class="bm-stat__value">2.1</span><span class="bm-stat__unit">ml/s</span></div><div class="bm-segbar bm-segbar--fill bm-segbar--flow" data-segbar="8/20"></div></div></section>
  <section class="bm-tile" style="width:200px"><div class="bm-stat"><span class="bm-eyebrow">Weight</span><div class="bm-stat__row"><span class="bm-stat__value">—</span><span class="bm-stat__unit">g</span></div><div class="bm-segbar bm-segbar--fill bm-segbar--weight" data-segbar="0/20"></div></div></section>
  <section class="bm-tile" style="width:412px"><div class="bm-tile__head"><h2 class="bm-sub">Shot results</h2><span class="bm-chip">30.2 s</span></div><div class="bm-grid2"><div class="bm-cell"><div class="bm-stat bm-stat--sm"><span class="bm-eyebrow">Yield</span><div class="bm-stat__row"><span class="bm-stat__value">36.1</span><span class="bm-stat__unit">g</span></div></div></div><div class="bm-cell"><div class="bm-stat bm-stat--sm"><span class="bm-eyebrow">Ratio</span><div class="bm-stat__row"><span class="bm-stat__value">1:2.0</span></div></div></div><div class="bm-cell"><div class="bm-stat bm-stat--sm"><span class="bm-eyebrow">Max pressure</span><div class="bm-stat__row"><span class="bm-stat__value">10.0</span><span class="bm-stat__unit">bar</span></div></div></div><div class="bm-cell"><div class="bm-stat bm-stat--sm"><span class="bm-eyebrow">Avg flow</span><div class="bm-stat__row"><span class="bm-stat__value">1.9</span><span class="bm-stat__unit">ml/s</span></div></div></div></div></section>
</div>
<script>
BetterMate.hydrate();
</script>
</body>
</html>
