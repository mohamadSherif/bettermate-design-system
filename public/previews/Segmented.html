<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segmented control</title>
<link rel="stylesheet" href="/design/tokens.css">
<link rel="stylesheet" href="/design/bundle.css">
<style>html,body{background:var(--surface-0)}body{overflow-x:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme]) .bm-wm--light{display:none}:root:not([data-theme]) .bm-wm--dark{display:block}}</style>
<script>
/* Follow the theme of the page this preview sits in. */
(function () {
  var html = document.documentElement;
  function sync() {
    try {
      var t = parent.document.documentElement.getAttribute('data-theme');
      if (t) html.setAttribute('data-theme', t); else html.removeAttribute('data-theme');
    } catch (e) {}
  }
  sync();
  try { new MutationObserver(sync).observe(parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
})();
</script>
<script src="/design/bundle.js"></script>
</head>
<body>
<div class="bm-stage" style="flex-direction:column;gap:var(--space-5)">
  <div class="bm-rowx" style="gap:var(--space-6)">
    <div class="bm-seg" role="radiogroup" aria-label="Stop by"><button class="bm-seg__item" role="radio" aria-checked="true">Time</button><button class="bm-seg__item" role="radio" aria-checked="false">Weight</button></div>
    <div class="bm-seg" role="radiogroup" aria-label="Dashboard"><button class="bm-seg__item" role="radio" aria-checked="false">Simple</button><button class="bm-seg__item" role="radio" aria-checked="true">Advanced</button><button class="bm-seg__item" role="radio" aria-checked="false">Customize</button></div>
    <div class="bm-seg" role="radiogroup" aria-label="Theme"><button class="bm-seg__item" role="radio" aria-checked="false"><span data-icon="monitor" data-size="18"></span>System</button><button class="bm-seg__item" role="radio" aria-checked="false"><span data-icon="sun" data-size="18"></span>Light</button><button class="bm-seg__item" role="radio" aria-checked="true"><span data-icon="moon" data-size="18"></span>Dark</button></div>
    <div class="bm-seg" role="radiogroup" aria-label="Stop by"><button class="bm-seg__item" role="radio" aria-checked="true">Time</button><button class="bm-seg__item" role="radio" aria-checked="false" disabled>Weight</button></div>
  </div>
  <div class="bm-rowx" style="gap:var(--space-6);align-items:flex-start">
    <section class="bm-tile" style="width:296px"><span class="bm-eyebrow">Favourites at 320 px</span><div class="bm-seg bm-seg--scroll" role="radiogroup" aria-label="Favourite profiles"><button class="bm-seg__item" role="radio" aria-checked="true"><span class="bm-seg__label">First</span></button><button class="bm-seg__item" role="radio" aria-checked="false"><span class="bm-seg__label">Adaptive v2</span></button><button class="bm-seg__item" role="radio" aria-checked="false"><span class="bm-seg__label">Crème brûlée, slow bloom for light roasts</span></button><button class="bm-seg__item" role="radio" aria-checked="false"><span class="bm-seg__label">Turbo</span></button></div><p class="bm-help">The track scrolls. A long name truncates at 176 px.</p></section>
    <section class="bm-tile" style="width:296px"><span class="bm-eyebrow">Sharing a row</span><div class="bm-seg bm-seg--block" role="radiogroup" aria-label="Theme"><button class="bm-seg__item" role="radio" aria-checked="true">System</button><button class="bm-seg__item" role="radio" aria-checked="false">Light</button><button class="bm-seg__item" role="radio" aria-checked="false">Dark</button></div><div class="bm-cell"><span class="bm-eyebrow">Inside a cell</span><div class="bm-seg bm-seg--block bm-seg--on-tile" role="radiogroup" aria-label="Stop by"><button class="bm-seg__item" role="radio" aria-checked="true">Time</button><button class="bm-seg__item" role="radio" aria-checked="false">Weight</button></div></div></section>
  </div>
</div>
<script>
BetterMate.hydrate();
[].forEach.call(document.querySelectorAll('.bm-seg'), function (g) {
  g.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b || b.disabled) return; [].forEach.call(g.querySelectorAll('button'), function (x) { x.setAttribute('aria-checked', x === b ? 'true' : 'false'); }); });
});
</script>
</body>
</html>
