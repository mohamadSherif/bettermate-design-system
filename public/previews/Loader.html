<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loader</title>
<link rel="stylesheet" href="/design/tokens.css">
<link rel="stylesheet" href="/design/bundle.css">
<style>html,body{background:var(--surface-0)}body{overflow-x:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme]) .bm-wm--light{display:none}:root:not([data-theme]) .bm-wm--dark{display:block}}</style>
<script>
/* Follow the theme of the page this preview sits in. */
(function () {
  var html = document.documentElement;
  function sync() {
    try {
      var t = parent.document.documentElement.getAttribute('data-theme');
      if (t) html.setAttribute('data-theme', t); else html.removeAttribute('data-theme');
    } catch (e) {}
  }
  sync();
  try { new MutationObserver(sync).observe(parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
})();
</script>
<script src="/design/bundle.js"></script>
</head>
<body>
<div class="bm-stage" style="align-items:center">
  <div class="bm-rowx" style="gap:var(--space-5)"><span data-loader data-size="14"></span><span data-loader data-size="20"></span><span data-loader data-size="24"></span><span data-loader data-size="40"></span></div>
  <div class="bm-stack" style="width:300px">
    <button class="bm-btn bm-btn--primary bm-btn--block" aria-busy="true"><span data-loader data-size="18"></span>Saving</button>
    <button class="bm-cta" aria-busy="true"><span class="bm-cta__text"><span class="bm-cta__label">Starting</span><span class="bm-cta__sub">Waiting for the machine</span></span><span class="bm-cta__disc" data-loader data-size="24"></span></button>
  </div>
  <section class="bm-tile" style="width:320px">
    <div class="bm-notice" role="status"><span class="bm-notice__icon" data-loader data-size="20"></span><div class="bm-notice__body"><span class="bm-notice__title">Pairing the scale</span><span class="bm-notice__text">Keep it switched on and close by.</span></div></div>
    <span class="bm-field__msg"><span data-loader data-size="14"></span>Looking for networks nearby.</span>
  </section>
</div>
<script>
BetterMate.hydrate();
</script>
</body>
</html>
