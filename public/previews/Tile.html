<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tile and cell</title>
<link rel="stylesheet" href="/design/tokens.css">
<link rel="stylesheet" href="/design/bundle.css">
<style>html,body{background:var(--surface-0)}body{overflow-x:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme]) .bm-wm--light{display:none}:root:not([data-theme]) .bm-wm--dark{display:block}}</style>
<script>
/* Follow the theme of the page this preview sits in. */
(function () {
  var html = document.documentElement;
  function sync() {
    try {
      var t = parent.document.documentElement.getAttribute('data-theme');
      if (t) html.setAttribute('data-theme', t); else html.removeAttribute('data-theme');
    } catch (e) {}
  }
  sync();
  try { new MutationObserver(sync).observe(parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
})();
</script>
<script src="/design/bundle.js"></script>
</head>
<body>
<div class="bm-stage">
  <section class="bm-tile" style="width:248px" aria-labelledby="t1"><div class="bm-tile__head"><h2 class="bm-sub" id="t1">Recent shots</h2><a class="bm-link" href="#">All shots</a></div><p class="bm-help">One title, one list or reading, one control group.</p><button class="bm-btn">Tare</button></section>
  <section class="bm-tile bm-tile--heat" style="width:248px"><div class="bm-tile__head"><span class="bm-eyebrow">Steam boiler</span><span class="bm-chip bm-chip--heat">Heating</span></div><div class="bm-stat"><div class="bm-stat__row"><span class="bm-stat__value">118</span><span class="bm-stat__unit">°C</span><span class="bm-stat__target">/ 145</span></div><div class="bm-segbar bm-segbar--fill bm-segbar--heat" data-segbar="15/20/18"></div></div><button class="bm-btn bm-btn--outline">Cancel</button></section>
  <section class="bm-tile bm-tile--primary" style="width:248px"><div class="bm-tile__head"><h2 class="bm-sub">Adaptive v2</h2><span class="bm-chip bm-chip--ink">In use</span></div><span class="bm-data">93° · 36 g · 3 phases</span><p class="bm-help">Preinfuse, bloom, then ramp to 9 bar.</p></section>
  <section class="bm-tile" style="width:248px"><div class="bm-tile__head"><h2 class="bm-sub">Shot results</h2><span class="bm-chip">30.2 s</span></div><div class="bm-grid2"><div class="bm-cell"><div class="bm-stat bm-stat--sm"><span class="bm-eyebrow">Yield</span><div class="bm-stat__row"><span class="bm-stat__value">36.1</span><span class="bm-stat__unit">g</span></div></div></div><div class="bm-cell"><div class="bm-stat bm-stat--sm"><span class="bm-eyebrow">Ratio</span><div class="bm-stat__row"><span class="bm-stat__value">1:2.0</span></div></div></div></div></section>
</div>
<script>
BetterMate.hydrate();
</script>
</body>
</html>
