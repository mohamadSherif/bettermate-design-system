<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chip</title>
<link rel="stylesheet" href="/design/tokens.css">
<link rel="stylesheet" href="/design/bundle.css">
<style>html,body{background:var(--surface-0)}body{overflow-x:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme]) .bm-wm--light{display:none}:root:not([data-theme]) .bm-wm--dark{display:block}}</style>
<script>
/* Follow the theme of the page this preview sits in. */
(function () {
  var html = document.documentElement;
  function sync() {
    try {
      var t = parent.document.documentElement.getAttribute('data-theme');
      if (t) html.setAttribute('data-theme', t); else html.removeAttribute('data-theme');
    } catch (e) {}
  }
  sync();
  try { new MutationObserver(sync).observe(parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
})();
</script>
<script src="/design/bundle.js"></script>
</head>
<body>
<div class="bm-stage" style="flex-direction:column;gap:var(--space-4)"><div class="bm-rowx">
  <span class="bm-chip bm-chip--success"><i class="bm-chip__dot"></i>Ready</span>
  <span class="bm-chip bm-chip--heat">Heating</span>
  <span class="bm-chip bm-chip--primary"><i class="bm-chip__dot"></i>Brewing</span>
  <span class="bm-chip bm-chip--warning"><span data-icon="triangle-alert" data-size="14"></span>Flush recommended</span>
  <span class="bm-chip bm-chip--danger"><span data-icon="circle-alert" data-size="14"></span>Scale lost</span>
  <span class="bm-chip bm-chip--ink">In use</span>
  <span class="bm-chip">Pro</span>
  <span class="bm-chip">30.2 s</span>
</div>
<div class="bm-rowx"><span class="bm-eyebrow">Heat beside warning</span><span class="bm-chip bm-chip--heat">Heating</span><span class="bm-chip bm-chip--warning"><span data-icon="triangle-alert" data-size="14"></span>Water low</span></div>
</div>
<script>
BetterMate.hydrate();
</script>
</body>
</html>
