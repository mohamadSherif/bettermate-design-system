<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Display: Brew</title>
<link rel="stylesheet" href="/design/tokens.css">
<link rel="stylesheet" href="/design/bundle.css">
<style>html,body{background:var(--surface-0)}body{overflow-x:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme]) .bm-wm--light{display:none}:root:not([data-theme]) .bm-wm--dark{display:block}}</style>
<script>
/* Follow the theme of the page this preview sits in. */
(function () {
  var html = document.documentElement;
  function sync() {
    try {
      var t = parent.document.documentElement.getAttribute('data-theme');
      if (t) html.setAttribute('data-theme', t); else html.removeAttribute('data-theme');
    } catch (e) {}
  }
  sync();
  try { new MutationObserver(sync).observe(parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
})();
</script>
<script src="/design/bundle.js"></script>
</head>
<body>
<div class="bm-stage">
  <figure class="bm-fig"><div data-face='{"s": "brew", "state": "heating", "target": 93, "temp": "78", "tempF": 0.49, "targetF": 0.58, "profile": "Classic"}'></div><figcaption>Heating</figcaption></figure>
  <figure class="bm-fig"><div data-face='{"s": "brew", "state": "ready", "target": 93, "temp": "93", "tempF": 0.58, "targetF": 0.58, "profile": "Classic"}'></div><figcaption>Ready</figcaption></figure>
  <figure class="bm-fig"><div data-face='{"s": "brew", "state": "ready", "target": 93, "temp": "93", "tempF": 0.58, "targetF": 0.58, "profile": "Adaptive v2", "scale": "0.0 G", "exception": "warning"}'></div><figcaption>Scale connected, one warning</figcaption></figure>
</div>
<script>BetterMate.hydrate();</script>
</body>
</html>
