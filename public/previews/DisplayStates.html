<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Display: product states</title>
<link rel="stylesheet" href="/design/tokens.css">
<link rel="stylesheet" href="/design/bundle.css">
<style>html,body{background:var(--surface-0)}body{overflow-x:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme]) .bm-wm--light{display:none}:root:not([data-theme]) .bm-wm--dark{display:block}}</style>
<script>
/* Follow the theme of the page this preview sits in. */
(function () {
  var html = document.documentElement;
  function sync() {
    try {
      var t = parent.document.documentElement.getAttribute('data-theme');
      if (t) html.setAttribute('data-theme', t); else html.removeAttribute('data-theme');
    } catch (e) {}
  }
  sync();
  try { new MutationObserver(sync).observe(parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
})();
</script>
<script src="/design/bundle.js"></script>
</head>
<body>
<div class="bm-stage">
  <figure class="bm-fig"><div data-face='{"s": "standby", "time": "10:51", "date": "THU 12 NOV", "line": "Waiting for the controller", "temp": 0.04, "busy": true}'></div><figcaption>Connecting</figcaption></figure>
  <figure class="bm-fig"><div data-face='{"s": "info", "heading": "JOIN THIS WI-FI", "ssid": "BetterMate-A1B2", "ip": "192.168.4.1", "hint": "SCAN TO SET UP", "action": false, "label": "Wi-Fi setup"}'></div><figcaption>Wi-Fi setup</figcaption></figure>
  <figure class="bm-fig"><div data-face='{"s": "brew", "state": "ready", "temp": "93", "target": 93, "tempF": 0.58, "targetF": 0.58, "profile": "Classic", "pending": true, "label": "Command pending"}'></div><figcaption>Command pending</figcaption></figure>
  <figure class="bm-fig"><div data-face='{"s": "brew", "state": "ready", "temp": "93", "target": 93, "tempF": 0.58, "targetF": 0.58, "profile": "Classic", "exception": "warning", "label": "A warning is waiting"}'></div><figcaption>A warning is waiting</figcaption></figure>
  <figure class="bm-fig"><div data-face='{"s": "fault", "title": "Boiler sensor lost", "lines": ["Heating is off.", "Check the sensor cable."], "action": ["RESTART", "primary"], "label": "Blocking fault"}'></div><figcaption>Blocking fault</figcaption></figure>
  <figure class="bm-fig"><div data-face='{"s": "fault", "title": "Controller not found", "lines": ["Check power and cable.", "Trying again every 5 s."], "label": "Fault with nothing to press"}'></div><figcaption>Fault, nothing to press</figcaption></figure>
  <figure class="bm-fig"><div data-face='{"s": "standby", "time": "10:51", "date": "THU 12 NOV", "line": "Update 1.8.0 is ready", "temp": 0.13, "exception": "update"}'></div><figcaption>An update is waiting</figcaption></figure>
  <figure class="bm-fig"><div data-face='{"s": "update", "progress": 0.62, "line": "Keep the machine on", "note": "1.8.0", "label": "Firmware update"}'></div><figcaption>Firmware update</figcaption></figure>
</div>
<script>
BetterMate.hydrate();
</script>
</body>
</html>
