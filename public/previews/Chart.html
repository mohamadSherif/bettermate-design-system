<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart</title>
<link rel="stylesheet" href="/design/tokens.css">
<link rel="stylesheet" href="/design/bundle.css">
<style>html,body{background:var(--surface-0)}body{overflow-x:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme]) .bm-wm--light{display:none}:root:not([data-theme]) .bm-wm--dark{display:block}}</style>
<script>
/* Follow the theme of the page this preview sits in. */
(function () {
  var html = document.documentElement;
  function sync() {
    try {
      var t = parent.document.documentElement.getAttribute('data-theme');
      if (t) html.setAttribute('data-theme', t); else html.removeAttribute('data-theme');
    } catch (e) {}
  }
  sync();
  try { new MutationObserver(sync).observe(parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
})();
</script>
<script src="/design/bundle.js"></script>
</head>
<body>
<div class="bm-stage">
  <section class="bm-tile" style="width:680px">
    <div class="bm-tile__head"><h2 class="bm-sub">Last shot</h2><span class="bm-rowx" style="gap:var(--space-2)"><span class="bm-chip"><span data-chart-key="pressure"></span>Pressure</span><span class="bm-chip"><span data-chart-key="temperature"></span>Temp</span><span class="bm-chip"><span data-chart-key="flow"></span>Flow</span><span class="bm-chip"><span data-chart-key="weight"></span>Weight</span></span></div>
    <div data-chart='{"label": "Pressure, temperature, flow and weight over a 30 second shot. Final values: 9.0 bar, 93 degrees, 2.1 millilitres a second, 36.1 grams.", "h": 240, "x": {"max": 30, "ticks": [0, 10, 20, 30], "unit": "s"}, "y": {"max": 12, "ticks": [0, 4, 8, 12]}, "series": [{"key": "temperature", "max": 120, "unit": "\u00b0", "digits": 0, "points": [[0, 92], [6, 91], [12, 93], [30, 93]]}, {"key": "pressure", "unit": " bar", "points": [[0, 0.2], [3, 1.4], [6, 2.0], [8, 2.2], [11, 5.5], [14, 8.4], [17, 9.1], [24, 9.1], [30, 9.0]]}, {"key": "weight", "max": 48, "unit": " g", "points": [[0, 0], [8, 0.4], [12, 4.0], [18, 14.5], [24, 26.0], [30, 36.1]]}, {"key": "flow", "max": 6, "unit": " ml/s", "points": [[0, 0], [5, 0.3], [9, 0.9], [13, 1.6], [17, 2.0], [24, 2.1], [30, 2.1]]}]}'></div>
  </section>
  <section class="bm-tile" style="width:296px">

    <div data-chart='{"label": "Pressure, temperature, flow and weight over a 30 second shot. Final values: 9.0 bar, 93 degrees, 2.1 millilitres a second, 36.1 grams.", "h": 200, "x": {"max": 30, "ticks": [0, 10, 20, 30], "unit": "s"}, "y": {"max": 12, "ticks": [0, 4, 8, 12]}, "series": [{"key": "temperature", "max": 120, "unit": "\u00b0", "digits": 0, "points": [[0, 92], [6, 91], [12, 93], [30, 93]]}, {"key": "pressure", "unit": " bar", "points": [[0, 0.2], [3, 1.4], [6, 2.0], [8, 2.2], [11, 5.5], [14, 8.4], [17, 9.1], [24, 9.1], [30, 9.0]]}, {"key": "weight", "max": 48, "unit": " g", "points": [[0, 0], [8, 0.4], [12, 4.0], [18, 14.5], [24, 26.0], [30, 36.1]]}, {"key": "flow", "max": 6, "unit": " ml/s", "points": [[0, 0], [5, 0.3], [9, 0.9], [13, 1.6], [17, 2.0], [24, 2.1], [30, 2.1]]}]}'></div>
  </section>
</div>

</html>
